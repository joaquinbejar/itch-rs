[package]
name        = "itch-conformance"
description = "Canonical conformance vectors and async test drivers for ITCH 5.0 / SoupBinTCP / MoldUDP64 implementations"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
itch-protocol = { workspace = true }
thiserror     = { workspace = true }

# Optional transport drivers — only pulled in when the corresponding
# feature is enabled.
itch-soup = { workspace = true, optional = true }
itch-mold = { workspace = true, optional = true }
tokio     = { workspace = true, features = ["net", "rt", "macros", "time"], optional = true }
futures   = { workspace = true, optional = true }

[features]
default = []
# Enables the async SoupBinTCP test driver under `crate::soup`.
soup = ["dep:itch-soup", "dep:tokio", "dep:futures"]
# Enables the async MoldUDP64 test driver under `crate::mold`.
mold = ["dep:itch-mold", "dep:tokio", "dep:futures"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
