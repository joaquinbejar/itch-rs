[package]
name        = "itch-protocol"
description = "NASDAQ TotalView-ITCH 5.0 message types and binary codec (sync, no I/O)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
thiserror = { workspace = true }

# A `std` feature for the eventual `no_std` story (ADR-0005) lands
# alongside `ProtocolError` in issue #6, where it actually gates
# `std::error::Error` plumbing. Adding it here as a stub would expose
# an inert flag in the public surface, so it stays absent until then.

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "throughput"
harness = false
