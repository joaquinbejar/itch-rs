[package]
name        = "itch-soup"
description = "SoupBinTCP 3.00 packet envelope codec for itch-protocol"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
itch-protocol = { workspace = true }
itch-source   = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["net", "rt", "macros", "time", "sync"] }
tokio-util    = { workspace = true, features = ["codec"] }
bytes         = { workspace = true }
futures       = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros", "time", "io-util", "test-util", "rt-multi-thread"] }
