[package]
name        = "itch-soup"
description = "SoupBinTCP 3.00 packet envelope codec for itch-protocol"
version                = "1.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
itch-protocol = { workspace = true }
itch-source   = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["net", "rt", "macros", "time", "sync"] }
tokio-util    = { workspace = true, features = ["codec"] }
bytes         = { workspace = true }
futures       = { workspace = true }
tracing       = { workspace = true }
# Used only by `ResilientSoupClient` for backoff jitter (issue #17).
rand          = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros", "time", "io-util", "test-util", "rt-multi-thread"] }
itch-source = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
# `integration` enables the `tests/integration.rs` end-to-end test
# target. With #17 + #18 now on main the tests link against the
# public API. Run with:
#   cargo test -p itch-soup --features integration --test integration
integration = []

[[bench]]
name = "soup_codec"
harness = false
