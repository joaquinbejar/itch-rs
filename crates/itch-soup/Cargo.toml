[package]
name        = "itch-soup"
description = "SoupBinTCP 3.00 packet envelope codec for itch-protocol"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
itch-protocol = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["net", "rt", "macros", "time"] }
tokio-util    = { workspace = true, features = ["codec"] }
bytes         = { workspace = true }
futures       = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros", "time", "io-util", "test-util", "rt-multi-thread"] }
itch-source = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# The end-to-end `tests/integration.rs` target depends on
# `SoupServer` (issue #18) and `ResilientSoupClient` (issue #17).
# Until those PRs are merged on `main` the test target is gated
# out via a custom cfg flag (NOT a feature, so `--all-features`
# stays clean). Run after merge with:
#
#   RUSTFLAGS="--cfg soup_integration_tests" cargo test -p itch-soup --test integration
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(soup_integration_tests)"] }
