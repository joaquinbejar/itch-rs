[package]
name        = "itch-source-postgres"
description = "PostgreSQL-backed SeqStore for durable ITCH 5.0 publisher replay"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
itch-protocol = { workspace = true }
itch-source   = { workspace = true }
async-trait   = "0.1"
thiserror     = { workspace = true }
tracing       = { workspace = true }
bytes         = { workspace = true }
sqlx          = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate"] }
tokio         = { workspace = true, features = ["rt", "time", "macros"] }

[dev-dependencies]
itch-source = { workspace = true }
tokio       = { workspace = true, features = ["rt", "time", "macros", "sync", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
