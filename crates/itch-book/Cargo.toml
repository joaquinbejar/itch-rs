[package]
name        = "itch-book"
description = "Order-book reconstruction (L2 price levels) from a stream of ITCH 5.0 messages"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
itch-protocol = { workspace = true }
thiserror     = { workspace = true }

# Optional thin async adapter that consumes a `Stream<Item = Result<Message, _>>`
# and feeds messages into a book. Default features stay sync-only — no
# runtime dependency unless the consumer opts in.
tokio   = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["l3"]
# Enables the L3 (per-order) book and the L3 routing path on
# `BookManager`. The `l3` module itself is always compiled — only the
# `BookManager`'s L3 fields and methods are gated, so the manager can
# stay lean for L2-only consumers via `--no-default-features`.
l3 = []
# Enables `BookManager::run`, an async helper that drains a
# `futures::Stream<Item = Result<Message, ProtocolError>>` into a
# `BookManager`. Pulls in `tokio` and `futures`.
tokio-stream = ["dep:tokio", "dep:futures"]
# Enables the EOD validation path that consumes a NASDAQ-licensed
# capture under `vendor/captures/`. The synthetic-day harness in
# `tests/eod_validation.rs` runs unconditionally; the capture-backed
# tests are gated behind this feature so OSS clones do not require a
# bundled vendor file. See `docs/TESTING.md` §10 for the migration
# path from synthetic-day → public capture.
vendor-captures = []
